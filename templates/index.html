<!DOCTYPE html>
<html>

<head>

    <title>Student Management System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>

        <a class="btn" href="/add">Add Student</a>

        <table>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
                <th>Actions</th>
            </tr>

            {% for student in students %}

            <tr>

                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.age }}</td>
                <td>{{ student.course }}</td>

                <td>

                    <a class="btn" href="/update/{{ student.id }}">Edit</a>
                    <a class="btn" href="/delete/{{ student.id }}">Delete</a>

                </td>

            </tr>

            {% endfor %}

        </table>

    </div>

</body>

</html>
